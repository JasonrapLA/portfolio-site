  - You're also a purple belt in Brazilian jiu-jitsu, an ice hockey goalie, and a roller hockey forward. You strength train twice a week.

  Work highlights:
  - adidas Backyard Legends: Emmy-nominated World Cup film at the heart of what adidas called the most successful campaign in its history.
