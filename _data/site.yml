about:
  - "Advertising goes back three generations in my family. My grandfather was in the business, my dad was too, and I followed them in. I skipped ad school and started as an intern at TBWA\\Chiat\\Day, learning the craft around people like Lee Clow."
  - "Since then I’ve led pitches and creative across sport, telecom, food, entertainment and social impact. Alongside longtime partner Mike Bokman, I ran Boost Mobile and helped grow Cox into one of the most awarded accounts in the country."
  - "Born and raised in Venice, California. French was my first language. These days it’s a respectable second."

