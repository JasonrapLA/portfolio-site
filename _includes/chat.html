{% assign c = site.data.chat %}
{% if c.enabled %}
<button class="chat-btn" id="chatBtn" type="button" aria-label="Chat with Jason" aria-expanded="false" aria-controls="chatPanel">
  <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><path d="M11 2C6.03 2 2 5.58 2 10c0 2.1.9 4 2.4 5.4L3 20l4.8-1.5C9 19.5 10 19.7 11 19.7c4.97 0 9-3.58 9-8s-4.03-8-9-8z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
</button>
<div class="chat-panel" id="chatPanel" role="dialog" aria-label="Chat with Jason" hidden>
  <div class="chat-header">
    <div class="chat-header-left"><span class="chat-name">{{ site.data.site.name }}</span><span class="chat-sub mono">Ask me anything</span></div>
    <button class="chat-close" id="chatClose" type="button" aria-label="Close chat">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </div>
  <div class="chat-messages" id="chatMessages" aria-live="polite">
    <div class="chat-msg assistant"><div class="chat-bubble">{{ c.greeting }}</div></div>
  </div>
  <div class="chat-suggestions" id="chatSuggestions">
    {% for sug in c.suggestions %}<button class="chat-suggestion" type="button">{{ sug }}</button>{% endfor %}
  </div>
  <form class="chat-input-row" id="chatForm">
    <label class="sr-only" for="chatInput">Message</label>
    <input class="chat-input" id="chatInput" type="text" placeholder="Ask me anything…" autocomplete="off">
    <button class="chat-send" id="chatSend" type="submit" aria-label="Send">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 8h10M8.5 3.5 13 8l-4.5 4.5"/></svg>
    </button>
  </form>
</div>
<script>
  window.CHAT_CONFIG = {
    endpoint: {{ c.endpoint | jsonify }},
    model: {{ c.model | jsonify }},
    system: {{ c.system_prompt | jsonify }}
  };
</script>
{% endif %}
